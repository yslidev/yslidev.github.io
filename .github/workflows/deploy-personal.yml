name: Deploy personal site (ysli.dev)

# Builds the friends-and-family variant of this same codebase and publishes it
# to the gh-pages branch of yslidev/ysli.dev, whose Pages site serves ysli.dev.
# Needs a repository secret PERSONAL_SITE_TOKEN: a fine-grained token with
# Contents read/write on yslidev/ysli.dev. Without it, this workflow no-ops.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.PERSONAL_SITE_TOKEN != '' }}
    steps:
      - name: Skip until the personal repo is wired up
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::PERSONAL_SITE_TOKEN is not set, so ysli.dev was not deployed."

      - name: Checkout
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        if: env.HAS_TOKEN == 'true'
        run: npm ci

      - name: Build ysli.dev
        if: env.HAS_TOKEN == 'true'
        run: bash scripts/build-personal.sh

      - name: Publish to yslidev/ysli.dev (gh-pages)
        if: env.HAS_TOKEN == 'true'
        env:
          TOKEN: ${{ secrets.PERSONAL_SITE_TOKEN }}
        run: |
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from yslidev.github.io"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/yslidev/ysli.dev.git" gh-pages
